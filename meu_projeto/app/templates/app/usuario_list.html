<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Usuários</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        a { color: #007bff; text-decoration: none; }
        .actions { display: flex; gap: 10px; }
        .btn { display: inline-block; padding: 8px 12px; background: #007bff; color: white; border-radius: 4px; }
        .btn-danger { background: #dc3545; }
    </style>
</head>
<body>
    <h1>Lista de usuários</h1>
    <a class="btn" href="{% url 'usuario_create' %}">Novo usuário</a>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Login</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for usuario in usuarios %}
            <tr>
                <td>{{ usuario.first_name }} {{ usuario.last_name }}</td>
                <td>{{ usuario.login }}</td>
                <td>{{ usuario.email }}</td>
                <td>{{ usuario.phone }}</td>
                <td class="actions">
                    <a href="{% url 'usuario_detail' usuario.pk %}">Ver</a>
                    <a href="{% url 'usuario_update' usuario.pk %}">Editar</a>
                    <a href="{% url 'usuario_delete' usuario.pk %}" onclick="return confirm('Deseja excluir este usuário?')">Excluir</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5">Nenhum usuário cadastrado.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
