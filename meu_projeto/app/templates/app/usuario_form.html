<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        form { max-width: 600px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, button { width: 100%; padding: 10px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-link { display: inline-block; margin-top: 10px; color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <h1>{{ titulo }}</h1>

    <form method="post">
        {% csrf_token %}

        {% for field in form %}
            <div class="form-group">
                {{ field.label_tag }}
                {{ field }}
                {% if field.errors %}
                    <div style="color: red; font-size: 12px;">{{ field.errors }}</div>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit">Salvar</button>
    </form>

    <a class="btn-link" href="{% url 'usuario_list' %}">Voltar para lista</a>
</body>
</html>
